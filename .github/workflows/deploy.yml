# Publie le portfolio sur GitHub Pages à chaque push sur main.
# Réglage unique sur GitHub : Settings > Pages > Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # Le site utilise des chemins absolus (/brand, /projects…) : il doit être servi à la racine,
      # donc depuis un dépôt nommé <pseudo>.github.io (ou avec un domaine personnalisé).
      - name: Vérifier que le site est servi à la racine
        run: |
          if [ -n "${{ steps.pages.outputs.base_path }}" ]; then
            echo "::error::Le site serait servi sous '${{ steps.pages.outputs.base_path }}'. Renommez le dépôt en <pseudo>.github.io (ou configurez un domaine personnalisé)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build (pré-rendu, sitemap, page 404)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
