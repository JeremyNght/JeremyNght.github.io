server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Fichiers versionnés par Vite : cache longue durée
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Captures, photo, aperçus de lien : cache d'un mois (comme vercel.json)
  location ~ ^/(projects|brand|og)/.+\.(webp|png|jpg|jpeg)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Une page HTML pré-rendue par projet : /projets/<slug>/index.html
  location /projets/ {
    try_files $uri $uri/index.html /index.html;
  }

  # Application monopage : toute autre route (ex. /projects/<slug> en anglais) renvoie index.html
  location / {
    try_files $uri /index.html;
  }
}
